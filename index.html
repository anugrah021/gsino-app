<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gsino - Coming Soon</title>
    <!-- Script resmi Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            background-color: #0b0e14;
        }

        /* Background Full Layar dengan Efek Blur */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .bg-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(10px);
            -webkit-filter: blur(10px);
            transform: scale(1.1); /* Menutupi pinggiran blur */
        }

        /* Lapisan Gelap Transparan agar Konten Terbaca Jelas */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 14, 20, 0.75);
            z-index: 2;
        }

        /* Konten Utama di Tengah Layar */
        .content-container {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        /* Gaya Teks Gsino */
        .brand-title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }

        /* Teks Coming Soon Elegan & Profesional */
        .coming-soon-text {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 6px;
            color: #a5b4fc;
            text-transform: uppercase;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(0, 255, 204, 0.3);
            padding-bottom: 8px;
        }

        /* Daftar Task / Tombol Sosial Media */
        .tasks-wrapper {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 20px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .task-btn:hover {
            background: rgba(0, 255, 204, 0.15);
            border-color: #00ffcc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.2);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task-icon {
            font-size: 1.2rem;
        }

        .task-action {
            font-size: 0.8rem;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Background Full Layar & Blur -->
    <div class="bg-container">
        <!-- Anda bisa ganti URL gambar di bawah sesuai selera -->
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop" alt="Gsino Background">
    </div>
    <div class="overlay"></div>

    <!-- Konten -->
    <div class="content-container">
        <div class="brand-title">Gsino</div>
        <div class="coming-soon-text">Coming Soon</div>

        <!-- Tombol Task Whitelist -->
        <div class="tasks-wrapper">
            <a href="https://t.me/Gsino_Official" target="_blank" class="task-btn">
                <div class="task-info">
                    <span class="task-icon">📢</span>
                    <span>Join Official Channel</span>
                </div>
                <span class="task-action">Join</span>
            </a>

            <a href="https://t.me/GsinoGrup" target="_blank" class="task-btn">
                <div class="task-info">
                    <span class="task-icon">💬</span>
                    <span>Join Community Group</span>
                </div>
                <span class="task-action">Join</span>
            </a>

            <a href="https://x.com/GsinoApp" target="_blank" class="task-btn">
                <div class="task-info">
                    <span class="task-icon">🛜</span>
                    <span>Follow Official X (Twitter)</span>
                </div>
                <span class="task-action">Follow</span>
            </a>
        </div>
    </div>

    <script>
        // Inisialisasi Telegram Web App agar tampil fullscreen
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
