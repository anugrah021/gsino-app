<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gsino - Coming Soon</title>
    <!-- Script resmi Telegram Web App -->
    <script src="https://i.ibb.co.com/5hTg9D5v/Chat-GPT-Image-24-Sep-2026-01-36-26.png"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Gaya Teks Gsino di atas */
        .brand-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        /* Container Gambar dengan Efek Blur */
        .image-container {
            position: relative;
            width: 85%;
            max-width: 350px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            /* Efek Blur pada gambar */
            filter: blur(8px);
            -webkit-filter: blur(8px);
            transform: scale(1.05); /* Menutupi pinggiran blur yang bocor */
        }

        /* Tanda/Tulisan di atas gambar yang diblur */
        .coming-soon-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Judul / Teks Bergaya -->
    <div class="brand-title">Gsino</div>

    <!-- Area Gambar yang diblur -->
    <div class="image-container">
        <!-- Ganti link gambar di bawah dengan gambar Anda -->
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=600&auto=format&fit=crop" alt="Coming Soon Background">
        <div class="coming-soon-badge">Coming Soon!</div>
    </div>

    <script>
        // Inisialisasi Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Membuat aplikasi tampil fullscreen di Telegram
    </script>
</body>
</html>
